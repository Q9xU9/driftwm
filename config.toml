# driftwm configuration

## General
mod_key = "super"
focus_follows_mouse = true
window_placement = "auto"
focus_placement = "center"

[autostart]
exec = ["noctalia"]

[session]
restore_windows = true
restore_camera = true
restore_bookmarks = true

[env]
DISPLAY = ":0"

[input.keyboard]
layout = "us,ru"
repeat_rate = 30
repeat_delay = 200
layout_independent = true
num_lock = true
options = "grp:caps_toggle"


[input.trackpad]
tap_to_click = true
natural_scroll = true
tap_and_drag = true
accel_speed = 0.0
accel_profile = "adaptive"
disable_while_typing = true

[input.mouse]
accel_speed = 0.0
accel_profile = "flat"
natural_scroll = false

[input.touch]
enable = true

[input.tablet]

[cursor]
size = 18
inactive_opacity = 0.6

[navigation]
trackpad_speed = 1.5
mouse_speed = 1.0
drift = 0.5
camera_speed = 0.3
auto_navigate_on_close = true
auto_navigate_on_click = true
nudge_step = 20
resize_step = 20
pan_step = 100.0

[navigation.edge_pan]
zone = 100.0
speed_min = 4.0
speed_max = 10.0
cursor_pan = false
latency_ms = 120

[zoom]
step = 1.1
fit_padding = 80.0
reset_on_new_window = true
reset_on_activation = true

[snap]
enabled = true
gap = 12.0
outer_gap = 6.0
distance = 24.0
break_force = 32.0
corners = true
centers = true

[decorations]
bg_color = "#1e1e1e"
fg_color = "#f2f2f2"
corner_radius = 12
shadow = true
title_bar_height = 28
font = "Adwaita Sans"
font_size = 11
font_weight = "medium"
title_align = "center"
default_mode = "client"
border_width = 2
border_color = "#45475a"
border_color_focused = "#89b4fa"
opacity = 0.95
opacity_focused = 1.0

[effects]
blur_radius = 2
blur_strength = 1.1
animation_speed = 0.5
animation_scale = 0.95

[background]
type = "default"

[bindings]

[keybindings]
"mod+space" = "spawn noctalia msg panel-toggle launcher"
"mod+return" = "spawn alacritty"
"mod+q" = "close-window"
"mod+e" = "toggle-cursor-pan"
"mod+f" = "toggle-fullscreen"
"mod+m" = "fit-window"
"mod+shift+m" = "fit-window-snapped"
"mod+g" = "fill-window"
"mod+t" = "toggle-pin-to-screen"
"mod+c" = "center-window"
"mod+x" = "focus-center"
"mod+a" = "home-toggle"
"mod+s" = "suspend-window"
"mod+up" = "center-nearest up"
"mod+down" = "center-nearest down"
"mod+left" = "center-nearest left"
"mod+right" = "center-nearest right"
"mod+shift+up" = "nudge-window up"
"mod+shift+down" = "nudge-window down"
"mod+shift+left" = "nudge-window left"
"mod+shift+right" = "nudge-window right"
"mod+ctrl+up" = "pan-viewport up"
"mod+ctrl+down" = "pan-viewport down"
"mod+ctrl+left" = "pan-viewport left"
"mod+ctrl+right" = "pan-viewport right"
"alt+tab" = "cycle-windows forward"
"alt+shift+tab" = "cycle-windows backward"
"mod+equal" = "zoom-in"
"mod+minus" = "zoom-out"
"mod+0" = "zoom-reset"
"mod+z" = "zoom-reset"
"mod+w" = "zoom-to-fit"
"mod+shift+w" = "zoom-to-fit-snapped"
"mod+1" = "go-to-bookmark 1"
"mod+2" = "go-to-bookmark 2"
"mod+3" = "go-to-bookmark 3"
"mod+4" = "go-to-bookmark 4"
"mod+shift+1" = "set-bookmark 1"
"mod+shift+2" = "set-bookmark 2"
"mod+shift+3" = "set-bookmark 3"
"mod+shift+4" = "set-bookmark 4"
"mod+alt+up" = "send-to-output up"
"mod+alt+down" = "send-to-output down"
"mod+alt+left" = "send-to-output left"
"mod+alt+right" = "send-to-output right"
"mod+l" = "spawn noctalia msg session lock"
"mod+ctrl+shift+q" = "quit"
"XF86AudioRaiseVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86MonBrightnessUp" = "spawn brightnessctl set +5%"
"XF86MonBrightnessDown" = "spawn brightnessctl set 5%-"
"XF86AudioPlay" = "spawn playerctl play-pause"
"XF86AudioPause" = "spawn playerctl play-pause"
"XF86AudioNext" = "spawn playerctl next"
"XF86AudioPrev" = "spawn playerctl previous"
"XF86AudioStop" = "spawn playerctl stop"
"Print" = "spawn grim - | wl-copy"
"shift+Print" = "spawn grim -g \"$(slurp -d)\" - | wl-copy"
"ctrl+Print" = "spawn driftwm msg screenshot window -o - | wl-copy"

[mouse]
resize_on_border = true

[mouse.on-window]
# Убираем дефолтные alt+кнопка, заменяем на mod+alt
"alt+left" = "none"
"alt+right" = "none"
"mod+alt+left" = "move-window"
"mod+alt+right" = "resize-window"
"mod+alt+shift+left" = "move-snapped-windows"
"mod+alt+shift+right" = "resize-window-snapped"
"alt+middle" = "fit-window"
"mod+middle" = "toggle-fullscreen"

[mouse.on-canvas]
"left" = "pan-viewport"
"trackpad-scroll" = "pan-viewport"
"wheel-scroll" = "zoom"

[mouse.anywhere]
"mod+left" = "pan-viewport"
"mod+ctrl+left" = "center-nearest"
"mod+trackpad-scroll" = "pan-viewport"
"mod+wheel-scroll" = "zoom"

[gestures]

[gestures.on-window]

[gestures.on-canvas]
"2-finger-pinch" = "zoom"

[gestures.anywhere]
"3-finger-swipe" = "pan-viewport"
"4-finger-swipe" = "center-nearest"
"mod+2-finger-pinch" = "zoom"
"3-finger-pinch" = "zoom"
"4-finger-pinch-in" = "zoom-to-fit"
"4-finger-pinch-out" = "home-toggle"
"4-finger-hold" = "center-window"

[touch]

[touch.on-window]
"3-finger-doubletap" = "fit-window"
"3-finger-doubletap-swipe" = "move-window"
"3-finger-hold-swipe" = "resize-window"

[touch.on-canvas]
"1-finger-swipe" = "pan-viewport"
"2-finger-swipe" = "pan-viewport"
"2-finger-pinch" = "zoom"

[touch.anywhere]
"3-finger-swipe" = "pan-viewport"
"3-finger-pinch" = "zoom"
"4-finger-swipe" = "center-nearest"
"4-finger-pinch-in" = "zoom-to-fit"
"4-finger-pinch-out" = "home-toggle"
"3-finger-tap" = "center-window"

[xwayland]
enabled = true
path = "xwayland-satellite"

[backend]

[output.outline]
color = "#89b4fa"
thickness = 1
opacity = 0.4
